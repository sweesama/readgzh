  <body>
    <div id="root"></div>
    <noscript>
      <header>
        <h1>ReadGZH - 微信文章 AI 阅读器</h1>
        <p>ReadGZH 把微信公众号文章转换成更适合 AI 读取的精简内容：服务端抓取后剥离样式与私有标签，生成 AI 可直接访问的公开链接。可配合 ChatGPT、Claude、DeepSeek、豆包等能访问网页的 AI 工具使用；命中缓存的文章读取不扣积分。</p>
      </header>
      <main>
        <section id="why-readgzh">
          <h2>为什么需要 ReadGZH？</h2>
          <p>微信公众号对外部 HTTP 请求有严格的访问限制，AI 工具直接请求 mp.weixin.qq.com 链接通常拿不到正文。ReadGZH 通过服务端代理抓取文章，清理后生成一个 AI 可直接访问的公开链接。部分文章（已删除、仅视频、需要授权）可能无法提取，这种情况会明确报错。</p>
        </section>
        <section id="how-it-works">
          <h2>工作原理</h2>
          <ol>
            <li><strong>抓取</strong> — 服务端代理请求微信文章页面</li>
            <li><strong>清洗</strong> — 剥离 inline style、class、data-* 属性</li>
            <li><strong>过滤</strong> — 移除 mp-common-profile、mp-style 等微信私有标签</li>
            <li><strong>精简</strong> — 压缩空标签与嵌套容器，减少 AI 读取时的 token 开销</li>
            <li><strong>代理</strong> — 图片通过 CDN 代理转发，缓解微信图片链接过期问题</li>
            <li><strong>缓存</strong> — 文章存入共享缓存，后续读取不扣积分</li>
            <li><strong>输出</strong> — 纯 SSR HTML 直出，零 JavaScript 依赖</li>
          </ol>
        </section>
        <section id="feature-cache">
          <h2>共享缓存</h2>
          <p>任何用户读过的文章都会进入共享缓存。后续任何人或 AI Agent 再次读取该文章不消耗积分（仍有基础的频率与滥用保护）。</p>
        </section>
        <section id="feature-image-proxy">
          <h2>CDN 图片代理</h2>
          <p>微信文章的图片直链在站外经常失效。ReadGZH 将图片路由至 CDN 代理转发，让文章中的图片在 ReadGZH 页面上正常显示。</p>
        </section>
        <section id="feature-mcp">
          <h2>MCP 服务协议</h2>
          <p>ReadGZH 内置 Model Context Protocol (MCP) 服务端，支持 AI Agent 通过标准化协议直接调用。端点：POST https://api.readgzh.site/mcp-server</p>
        </section>
        <section id="core-api">
          <h2>核心 API</h2>
          <p>基础用法：GET https://api.readgzh.site/rd?url={微信文章链接}。添加 &amp;format=text 获取 Markdown 输出（推荐）。通过 &amp;part=N 分块读取长文章。Pro 用户可使用 &amp;mode=summary 获取 AI 结构化摘要。</p>
          <p>认证方式：请求头携带 Authorization: Bearer sk_live_... 可获得更高配额。未缓存文章每篇 3 积分；免费注册用户每日可领取 30 积分；未携带 Key 的匿名请求为每 IP 每天 10 积分。</p>
        </section>

        <section>
          <h2>如何使用</h2>
          <p>复制以下提示词发给任何 AI 工具即可：「请帮我阅读这篇微信公众号文章，你可以通过访问以下链接获取内容：https://api.readgzh.site/rd?url=（把微信链接粘贴在这里）」</p>
        </section>
